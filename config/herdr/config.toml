onboarding = false

[ui.toast]
delivery = "system"

[ui]
status_indicators = "dots"

[theme]
name = "terminal"
auto_switch = false

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "sjsimpson.wt-env.runtimes"
description = "runtimes dashboard"

# Workspace name color by kind: tooling gray (listed by name), reviews
# yellow ("<ticket> review", as deep-review names them), the rest (projects)
# blue
[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", fg = "#61afef", rules = [
    { contains = " review", fg = "#e5c07b" },
  ] }],
  ["branch", "git_status"],
]

[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", { token = "workspace", fg = "#61afef", rules = [
    { contains = " review", fg = "#e5c07b" },
  ] }, "tab"],
  ["agent"],
]
