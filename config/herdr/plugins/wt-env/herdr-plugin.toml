id = "sjsimpson.wt-env"
name = "Worktree env"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Per-worktree setup/teardown hooks and a runtimes dashboard"
platforms = ["linux", "macos"]

[[events]]
on = "worktree.created"
command = ["bash", "wt-env.sh"]

# also covers worktrees made outside herdr or before this plugin; wt-setup is idempotent
[[events]]
on = "worktree.opened"
command = ["bash", "wt-env.sh"]

[[events]]
on = "worktree.removed"
command = ["bash", "wt-env.sh"]

# Runtimes dashboard: everything each workspace is running (bind with keys.command)
[[actions]]
id = "runtimes"
title = "Runtimes dashboard"
command = ["sh", "-c", "\"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin sjsimpson.wt-env --entrypoint runtimes --focus"]

[[panes]]
id = "runtimes"
title = "Runtimes"
placement = "overlay"
command = ["python3", "runtimes.py"]
